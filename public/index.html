<!DOCTYPE html>
<html lang="it" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineFilm & TV | Passaporto per Cinema e Serie TV</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/custom.css">
</head>
<body>

    <!-- Header Navigation -->
    <header class="navbar navbar-expand-lg sticky-top bg-body-tertiary border-bottom border-dark-subtle">
        <div class="container">
            <a class="navbar-brand d-flex items-center gap-2" href="#">
                <i class="fa-solid fa-film text-danger fs-3"></i>
                <span class="fw-bold tracking-wider">CINE<span class="text-danger">FILM</span></span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto me-3">
                    <li class="nav-item"><a class="nav-link active" href="#home">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#trending">In Evidenza</a></li>
                    <li class="nav-item"><a class="nav-link" href="#categories">Categorie</a></li>
                    <li class="nav-item"><a class="nav-link" href="#top-chart">Top Chart</a></li>
                </ul>
                <button class="btn btn-danger btn-sm rounded-pill px-3" data-bs-toggle="modal" data-bs-target="#newsletterModal">
                    <i class="fa-solid fa-paper-plane me-1"></i> Iscriviti
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Placeholder -->
    <main class="container my-5">
        <!-- Hero Section, Articles, Filter Tabs, Top Charts -->
    </main>

    <!-- Modal Newsletter -->
    <div class="modal fade" id="newsletterModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-light border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title"><i class="fa-solid fa-clapperboard text-danger me-2"></i>Iscriviti al Club</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="newsletterForm">
                        <div class="mb-3">
                            <input type="email" class="form-control bg-dark-subtle text-light" placeholder="La tua email..." required>
                        </div>
                        <button type="submit" class="btn btn-danger w-100">Conferma Iscrizione</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
